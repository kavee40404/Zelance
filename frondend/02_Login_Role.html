<!DOCTYPE html>
<html lang="en">
<!--
  Page: 02_Login_Role.html
  Part: Part A (Accounts and start)
  Purpose: Role-based authentication screen allowing users to log in as a client, freelancer, or admin.
  Database tables: USERS
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Zelance Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/zelance.css">
</head>

<body class="center-layout">

  <!-- Main login card -->
  <main class="login-wrapper">
    <div class="header-row">
      <h1 class="login-title">Log In</h1>
    </div>

    <p class="login-subtext">Enter your Zelance credentials and select your workspace role.</p>

    <!-- Login form -->
    <!-- Connecting database here: this form will check the USERS table for matching email, password_hash, and role where status is ACTIVE. -->
    <form method="post" action="#">
      <div class="form-group">
        <label for="email" class="field-label">Email</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="e.g. ishara@zelance.dev" required>
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password_hash" class="field-label">Password</label>
          <a href="../php/forgot_password.php" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password_hash" name="password_hash" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        </div>
      </div>

      <div class="form-group">
        <label for="role" class="field-label">Role</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <select id="role" name="role" required>
            <option value="">Select your role...</option>
            <option value="CLIENT">Client (Organization)</option>
            <option value="FREELANCER">Freelancer (AI Specialist)</option>
            <option value="ADMIN">Administrator / Manager</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-login-submit btn-block">Log In &rarr;</button>

      <div class="divider-row">
        <span>OR</span>
      </div>

      <p class="auth-footer-prompt">
        Do not have an account? <a href="03_Freelancer_Register.html" class="register-link">Register</a>
      </p>
    </form>
  </main>

</body>

</html>

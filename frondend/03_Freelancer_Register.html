<!DOCTYPE html>
<html lang="en">
<!--
  Page: 03_Freelancer_Register.html
  Part: Part A (Accounts and start)
  Purpose: Registration page for new AI freelance engineers joining the platform.
  Database tables: USERS
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelance - Freelancer Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/zelance.css">
</head>
<body class="center-layout">

  <!-- Registration card container -->
  <main class="reg-wrapper">
    <div class="header-row">
      <h1 class="reg-title">Sign Up as AI Specialist</h1>
      <span class="badge-pill">Freelancer</span>
    </div>
    <p class="subtext">Join top AI researchers, ML engineers, and data specialists on Zelance.</p>

    <!-- Freelancer registration form -->
    <!-- Connecting database here: this form inserts a new user record into the USERS table with role = 'FREELANCER', status = 'ACTIVE', and created_at = CURRENT_TIMESTAMP. -->
    <form method="post" action="#">
      <input type="hidden" name="role" value="FREELANCER">

      <div class="form-group">
        <label for="full_name" class="field-label">Full Name</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" id="full_name" name="full_name" autocomplete="name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="field-label">Email Address</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password_hash" class="field-label">Password</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password_hash" name="password_hash" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="field-label">Confirm Password</label>
        <div class="input-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        </div>
      </div>

      <button type="submit" class="btn-submit btn-block">Create Freelancer Profile &rarr;</button>

      <div class="divider-row">
        <span>OR</span>
      </div>

      <p class="auth-footer-prompt">
        Already have an account? <a href="02_Login_Role.html" class="register-link">Log In</a>
        &bull;
        <a href="04_Client_Register.html" class="register-link">Sign up as Client</a>
      </p>
    </form>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelance - Project Payment Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/zelance.css">
</head>
<body>

    <header class="top-nav">
    <a href="01_Home_Landing.html" class="brand-wrap">
      <div class="star-icon"></div>
      <span class="brand-title">Zelance</span>
    </a>

    <!-- Step Indicator -->
    <div class="stepper-row">
      <div class="step-badge completed">
        <span class="step-circle">&check;</span>
        <span>1. Proposal Accepted</span>
      </div>
      <span class="stepper-separator">&mdash;&mdash;&mdash;</span>
      <div class="step-badge active">
        <span class="step-circle">2</span>
        <span>2. Secure Deposit</span>
      </div>
      <span class="stepper-separator">&mdash;&mdash;&mdash;</span>16
      <div class="step-badge">
        <span class="step-circle">3</span>
        <span>3. Contract Active</span>
      </div>
    </div>

    <div class="user-pill">
      <div class="user-avatar-circle">SJ</div>
      <span>Dr. Sarah Jenkins</span>
    </div>
  </header>
    
</body>
</html>

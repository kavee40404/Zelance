<!DOCTYPE html>
<html lang="en">
<!--
  Page: 05_Email_Verification.html
  
  Purpose: Step for entering a 6-digit confirmation security code to verify email address.
  
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelance - Verify Your Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/zelance.css">
</head>

<body class="center-layout">

  <!-- Verification code entry card -->
  <main class="otp-card">
    <div class="mail-icon-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
      </svg>
    </div>

    <div>
      <h1 class="title">Verify Your Email</h1>
      <p class="subtext mt-6">We have sent a 6-digit confirmation security code to your email address.</p>
    </div>

    <!-- Connecting database here: This page validates the 6-digit confirmation PIN generated by php/mailer.php. In full PHP integration, this form posts to ../php/verify_code_process.php which updates USERS status from PENDING to ACTIVE. In static preview, action forwards directly to 06_Freelancer_Step1_Personal.html. -->
    <form method="post" action="06_Freelancer_Step1_Personal.html">
      <div class="otp-inputs-row">
        <input type="text" name="verification_code_1" class="otp-digit" maxlength="1" required>
        <input type="text" name="verification_code_2" class="otp-digit" maxlength="1" required>
        <input type="text" name="verification_code_3" class="otp-digit" maxlength="1" required>
        <input type="text" name="verification_code_4" class="otp-digit" maxlength="1" required>
        <input type="text" name="verification_code_5" class="otp-digit" maxlength="1" required>
        <input type="text" name="verification_code_6" class="otp-digit" maxlength="1" required>
      </div>

      <button type="submit" class="btn-next mt-20">
        Verify &amp; Proceed to Onboarding <span>&rarr;</span>
      </button>
    </form>

    <div class="auth-footer-prompt">
      Did not receive the code? <a href="#" class="register-link">Resend Code</a>
    </div>
  </main>

</body>

</html>
